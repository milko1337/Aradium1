# - Rząd 3 (sloty 19..25): pierwszy rząd misji wybranego etapu (tematyczne przedmioty)
# - Rząd 4 (sloty 28..34): drugi rząd misji wybranego etapu
# - Rząd 5 (sloty 36..44): dolna linia z przyciskiem powrotu na slocie 40

